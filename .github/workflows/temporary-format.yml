name: Format frontend branch

on:
  push:
    branches:
      - format/readable-prettier-80col

permissions:
  contents: write

jobs:
  format-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Format source files
        run: npm run format

      - name: Check whitespace errors
        run: git diff --check

      - name: Commit formatted source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "Formatting already clean."
          else
            git add -A
            git commit -m "style: format Gemini frontend with prettier [skip ci]"
            git push origin "HEAD:format/readable-prettier-80col"
          fi

      - name: Verify formatting
        run: npm run format:check

      - name: Verify production build
        run: npm run build
